<!DOCTYPE html>
<html lang="es">
<head>

  <title>Login - Proyectos</title>

</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <h2>Seleccionar Usuario</h2>

      <form action="#" method="post">
        <label for="usuarioSelect">Usuarios disponibles</label>

        </select>

        <button type="submit" id="btnIngresar">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="../JS/auth.js"></script>
</body>
</html>
